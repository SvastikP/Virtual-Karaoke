<!-- Website view, create buttons, text, etc. --> 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Karaoke</title>
</head>
<body>
    <h1>Virtual Karaoke</h1>

    <div>
        <h2>Create a Room</h2>
        <input id="createRoomInput" type="text" placeholder="Enter room name">
        <button onclick="createRoom()">Create Room</button>
    </div>

    <div>
        <h2>Join a Room</h2>
        <input id="joinRoomInput" type="text" placeholder="Enter room name"> 
        <button onclick="joinRoom()">Join Room</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
